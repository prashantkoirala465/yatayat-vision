name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  cv-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cv-service
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yatayat
          POSTGRES_PASSWORD: yatayat
          POSTGRES_DB: yatayat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yatayat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://yatayat:yatayat@localhost:5432/yatayat
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -c "from app.main import app"
      - run: alembic upgrade head
      - run: pytest -v

  docker-build:
    # Only builds the two lean images - cv-worker needs trained model
    # weights baked in at build time (data/models/*.pt), which are
    # gitignored and don't exist in CI. See docs/deployment.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/Dockerfile.cv-service-api -t yatayat-cv-api cv-service
      - run: docker build -f infra/Dockerfile.dashboard -t yatayat-dashboard dashboard
